plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.moss.mmdruntime'
    compileSdk 34
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId "com.moss.mmdruntime"
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName "1.0-overlay"

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions -frtti'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp_ui/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            storeFile file("../keystore/mmdruntime.jks")
            storePassword "modelmod123"
            keyAlias "modelmod"
            keyPassword "modelmod123"
            storeType "jks"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    compileOnly project(':stubs')
    implementation 'androidx.core:core-ktx:1.12.0'
}
