plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.moss.mmdruntime'
    compileSdk 34
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId "com.moss.mmdruntime"
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName "1.2-egl"

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions -frtti'
            }
        }

        ndk {
            // 只出 arm64：thirdparty/dobby 只有 arm64-v8a 的静态库，
            // 没这个过滤 Gradle 会连带编 armeabi-v7a，链接直接报
            // "incompatible with armelf_linux_eabi"。游戏本身也是 arm64-only。
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp_ui/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            storeFile file("../keystore/mmdruntime.jks")
            storePassword "modelmod123"
            keyAlias "modelmod"
            keyPassword "modelmod123"
            storeType "jks"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    compileOnly project(':stubs')
    implementation 'androidx.core:core-ktx:1.12.0'
}
