name: Build MmdRuntime

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          set -x
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build shell APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Build libmmdruntime.so
        run: |
          set -x
          NDK=$ANDROID_HOME/ndk/25.2.9519653
          cmake -S native -B native/build \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build -j4
          ls -la native/build/*.so

      - name: Publish APK + so
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build-${{ github.run_number }}
          body: |
            commit ${{ github.sha }}
            ${{ github.event.head_commit.message }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            native/build/libmmdruntime.so
          fail_on_unmatched_files: false
